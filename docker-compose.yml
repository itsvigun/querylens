x-app: &app
  image: querylens-api:local
  build: .
  environment: &app-environment
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER:-querylens}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_DB: ${POSTGRES_DB:-querylens}
    DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-3}
    DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
  depends_on:
    db:
      condition: service_healthy

x-embeddings: &embedding-environment
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
  EMBEDDING_INDEX_VERSION: ${EMBEDDING_INDEX_VERSION:-v1}
  KNOWLEDGE_INDEX_NAME: ${KNOWLEDGE_INDEX_NAME:-default}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-20}

x-chat: &chat-environment
  <<: *embedding-environment
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-querylens}
  ANALYTICS_READONLY_PASSWORD: ${ANALYTICS_READONLY_PASSWORD:-}
  KNOWLEDGE_READONLY_PASSWORD: ${KNOWLEDGE_READONLY_PASSWORD:-}
  LLM_MODEL: ${LLM_MODEL:-gpt-5.4-mini}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
  REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
  LLM_MAX_CALLS: ${LLM_MAX_CALLS:-6}
  LLM_MAX_TOOL_CALLS: ${LLM_MAX_TOOL_CALLS:-8}
  LLM_MAX_SQL_CALLS: ${LLM_MAX_SQL_CALLS:-3}
  LLM_MAX_SQL_REPAIRS: ${LLM_MAX_SQL_REPAIRS:-2}
  LLM_MAX_INPUT_BYTES: ${LLM_MAX_INPUT_BYTES:-128000}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4000}
  SQL_MAX_ROWS: ${SQL_MAX_ROWS:-1000}
  SQL_MAX_RESULT_BYTES: ${SQL_MAX_RESULT_BYTES:-65536}
  SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-5000}
  SQL_TOOL_TIMEOUT_MS: ${SQL_TOOL_TIMEOUT_MS:-10000}

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-querylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-querylens}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    <<: *app
    environment:
      <<: [*app-environment, *chat-environment]
    init: true
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=10)"
      interval: 10s
      timeout: 12s
      retries: 5
      start_period: 5s

  migrate:
    <<: *app
    profiles: ["tools"]
    command: ["alembic", "upgrade", "head"]

  provision-roles:
    <<: *app
    profiles: ["tools"]
    environment:
      <<: *app-environment
      ANALYTICS_READONLY_PASSWORD: ${ANALYTICS_READONLY_PASSWORD:-}
      KNOWLEDGE_WRITER_PASSWORD: ${KNOWLEDGE_WRITER_PASSWORD:-}
      KNOWLEDGE_READONLY_PASSWORD: ${KNOWLEDGE_READONLY_PASSWORD:-}
    command: ["python", "-m", "scripts.provision_roles"]

  seed:
    <<: *app
    profiles: ["tools"]
    command: ["python", "-m", "scripts.seed"]

  verify-data:
    <<: *app
    profiles: ["tools"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ANALYTICS_READONLY_PASSWORD: ${ANALYTICS_READONLY_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-querylens}
    command: ["python", "-m", "scripts.verify_data"]

  query:
    <<: *app
    profiles: ["tools"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-querylens}
      ANALYTICS_READONLY_PASSWORD: ${ANALYTICS_READONLY_PASSWORD:-}
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-1000}
      SQL_MAX_RESULT_BYTES: ${SQL_MAX_RESULT_BYTES:-65536}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-5000}
      SQL_TOOL_TIMEOUT_MS: ${SQL_TOOL_TIMEOUT_MS:-10000}
    command: ["python", "-m", "scripts.query"]

  ingest:
    <<: *app
    profiles: ["tools"]
    environment:
      <<: *embedding-environment
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-querylens}
      KNOWLEDGE_WRITER_PASSWORD: ${KNOWLEDGE_WRITER_PASSWORD:-}
    command: ["python", "-m", "scripts.ingest"]

  search:
    <<: *app
    profiles: ["tools"]
    environment:
      <<: *embedding-environment
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-querylens}
      KNOWLEDGE_READONLY_PASSWORD: ${KNOWLEDGE_READONLY_PASSWORD:-}
    command: ["python", "-m", "scripts.search", "How is ARPU calculated?"]

  verify-retrieval:
    <<: *app
    profiles: ["tools"]
    environment:
      <<: *embedding-environment
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-querylens}
      KNOWLEDGE_READONLY_PASSWORD: ${KNOWLEDGE_READONLY_PASSWORD:-}
      KNOWLEDGE_WRITER_PASSWORD: ${KNOWLEDGE_WRITER_PASSWORD:-}
    command: ["python", "-m", "scripts.verify_retrieval", "--live"]

  ask:
    <<: *app
    profiles: ["tools"]
    environment: *chat-environment
    command: ["python", "-m", "scripts.ask", "What was revenue last month, in EUR?"]

  verify-tool-calling:
    <<: *app
    profiles: ["tools"]
    environment: *chat-environment
    command: ["python", "-m", "scripts.verify_tool_calling", "--live"]

volumes:
  postgres_data:
