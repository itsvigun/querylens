[project]
name = "querylens"
version = "0.1.0"
description = "Business analytics with documentation retrieval and read-only SQL."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18,<2",
    "fastapi>=0.136,<0.137",
    "psycopg2-binary>=2.9.11,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.0.46,<2.1",
    "uvicorn>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=9.1,<10",
    "ruff>=0.15.20,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: requires a migrated PostgreSQL database with pgvector"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
